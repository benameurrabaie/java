, "correct_answer": "e. All the answers are correct", "answer_status": "confirmed"}, {"id": "W2-T1-Q4", "question": "The meaning of \"uphold\" is", "type": "single_choice", "options": ["a. Abandon", "b. Maintain", "c. Decrease"], "correct_answer": "b. Maintain", "answer_status": "confirmed"}, {"id": "W2-T1-Q5", "question": "Which of the following best summarizes the main idea of the passage?", "type": "single_choice", "options": ["a. School cafeterias should maintain an elevated degree of food safety to guarantee an excellent health for schoolchildren.", "b. School cafeterias are regularly examined by public health authorities.", "c. School cafeterias should provide healthy, low-fat options for students."], "correct_answer": "a. School cafeterias should maintain an elevated degree of food safety to guarantee an excellent health for schoolchildren.", "answer_status": "confirmed"}]}]}, {"week": 3, "title": "Third Week: The Strategies of Reading", "activities": [{"activity": "Activity4", "sections": [{"instructions": "Complete the following sentences by choosing the appropriate option(s)- a, b, c, or d:", "questions": [{"id": "W3-A4-P1-Q1", "question": "In previewing, you examine………………", "type": "multiple_choice", "options": ["a. Pictures", "b. Main idea", "c. Appendix", "d. Bolded words"], "correct_answer": ["a. Pictures", "c. Appendix", "d. Bolded words"], "answer_status": "confirmed"}, {"id": "W3-A4-P1-Q2", "question": "Prior knowledge makes reading……………….", "type": "multiple_choice", "options": ["a. Easier", "b. Laborious", "c. Enjoyable", "d. Motivating"], "correct_answer": ["a. Easier", "c. Enjoyable", "d. Motivating"], "answer_status": "confirmed"}, {"id": "W3-A4-P1-Q3", "question": "The reader cannot learn more about a topic until……..", "type": "multiple_choice", "options": ["a. He/she previews the title.", "b. This topic is linked to his/her previous knowledge.", "c. He/she activates his/her prior knowledge.", "d. He/she makes educated guesses."], "correct_answer": ["b. This topic is linked to his/her previous knowledge.", "c. He/she activates his/her prior knowledge."], "answer_status": "confirmed"}, {"id": "W3-A4-P1-Q4", "question": "Activating background knowledge does not mean…………….", "type": "multiple_choice", "options": ["a. To use the information, you already have in your memory about topic.", "b. To make connections between the reader's previous knowledge and the text while reading the text.", "c. To show what you know about the topic of the text to be read.", "d. To be able to answer some comprehension questions."], "correct_answer": null, "answer_status": "unknown", "note": "The student selected c and d and both were marked wrong (0/1). The platform did not reveal the correct combination in the screenshots. Click 'Show answer' on the platform to get the key."}, {"id": "W3-A4-P1-Q5", "question": "We don't ask these questions when making predictions:", "type": "multiple_choice", "options": ["a. What do you know about the author?", "b. What might I anticipate to happen?", "c. What do I know about the topic?", "d. What clues might the author be giving me?"], "correct_answer": ["a. What do you know about the author?", "c. What do I know about the topic?"], "answer_status": "confirmed"}, {"id": "W3-A4-P1-Q6", "question": "The less you know about the topic of the text,…………", "type": "multiple_choice", "options": ["a. The better your learning will be.", "b. The most difficult your comprehension of the text will be.", "c. The easiest your comprehension of the text will be.", "d. The least you will learn from the text."], "correct_answer": ["b. The most difficult your comprehension of the text will be.", "d. The least you will learn from the text."], "answer_status": "confirmed"}]}, {"instructions": "Study the following tasks, and then say which before-reading strategy to be used:", "questions": [{"id": "W3-A4-P2-Q1", "question": "When using information from a text to anticipate what you are about to read. ...", "type": "single_choice", "options": ["a. Activating Prior Knowledge", "b. Previewing", "c. Making Predictions"], "correct_answer": "c. Making Predictions", "answer_status": "confirmed"}, {"id": "W3-A4-P2-Q2", "question": "When you recall your prior knowledge and set a purpose for your reading, you are ....", "type": "single_choice", "options": ["a. Previewing", "b. Activating Prior Knowledge", "c. Making Predictions"], "correct_answer": "a. Previewing", "answer_status": "confirmed"}, {"id": "W3-A4-P2-Q3", "question": "When you say, \"How is this text similar or different from the text I've read last week?\" It is …….", "type": "single_choice", "options": ["a. Previewing", "b. Making Predictions", "c. Activating Prior knowledge"], "correct_answer": "c. Activating Prior knowledge", "answer_status": "confirmed"}, {"id": "W3-A4-P2-Q4", "question": "When you say: \"From the first lines of this text, I think that the author will focus on food safety measures.\"", "type": "single_choice", "options": ["a. Making Predictions", "b. Previewing", "c. Activating Prior Knowledge"], "correct_answer": "a. Making Predictions", "answer_status": "confirmed"}, {"id": "W3-A4-P2-Q5", "question": "When the reader says, \"Hey, I've been to the desert last year during my spring holidays and my sister and I enjoyed our stay in an Oasis!\" prior to reading a text entitled \"At Oasis Resorts\".", "type": "single_choice", "options": ["a. Previewing", "b. Activating Prior knowledge", "c. Making Predictions"], "correct_answer": "b. Activating Prior knowledge", "answer_status": "confirmed"}, {"id": "W3-A4-P2-Q6", "question": "When looking quickly at a given material by examining pictures, reading the title and the subheadings, you are ……....", "type": "single_choice", "options": ["a. Making Predictions", "b. Using Prior knowledge", "c. Previewing"], "correct_answer": "c. Previewing", "answer_status": "confirmed"}]}], "max_points": 12}, {"activity": "Activity5", "sections": [{"instructions": "Complete the following sentences by choosing the appropriate option(s)- a, b, c, d or e:", "questions": [{"id": "W3-A5-P1-Q1", "question": "Searching for the meaning of an unknown word by focusing attention on the words surrounding it is an example of using……….. (several response are possible)", "type": "multiple_choice", "options": ["a. Inferencing", "b. Activating Prior knowledge", "c. Context clues"], "correct_answer": ["a. Inferencing", "c. Context clues"], "answer_status": "confirmed"}, {"id": "W3-A5-P1-Q2", "question": "Applying what you know about the components of the main idea when trying to understand a text is an example of using ………….", "type": "single_choice", "options": ["a. Context clues", "b. Inferencing", "c. Skimming", "d. Activating prior knowledge"], "correct_answer": "d. Activating prior knowledge", "answer_status": "confirmed"}, {"id": "W3-A5-P1-Q3", "question": "The main idea describes the author's ………. (several response are possible)", "type": "multiple_choice", "options": ["a.Opinion", "b.Prior knowledge", "c.Attitude"], "correct_answer": ["a.Opinion", "c.Attitude"], "answer_status": "confirmed"}, {"id": "W3-A5-P1-Q4", "question": "To identify the author's opinion attitude towards the topic, you ask about …….", "type": "single_choice", "options": ["a. The author's concern about 'what'", "b. What is the paragraph about?", "c. The author's concern about 'who'", "d. (a) and (b)", "e. (a) and (c)"], "correct_answer": "e. (a) and (c)", "answer_status": "confirmed"}, {"id": "W3-A5-P1-Q5", "question": "The main idea is regarded as a topic sentence when it is stated in the text:", "type": "single_choice", "options": ["a. Directly", "b. Implicitly", "c. Explicitly", "d. (a)and (c)", "e. (a) and (b)"], "correct_answer": "d. (a)and (c)", "answer_status": "confirmed"}, {"id": "W3-A5-P1-Q6", "question": "The topic sentence may take different positions in the paragraph, it can be placed at …………in the reading passage.", "type": "single_choice", "options": ["a.The middle position", "b.The last position", "c.The initial position", "d. All of them"], "correct_answer": "d. All of them", "answer_status": "confirmed"}]}, {"instructions": "Complete the following sentences by choosing the appropriate option(s)- a, b, c, d or e:", "questions": [{"id": "W3-A5-P2-Q1", "question": "When the author includes in the text words such as: \"alike, similar to, different from, instead\", these words signal ____.", "type": "single_choice", "options": ["a. Contrast pattern of organization", "b. Comparison/contrast pattern of organization.", "c. Comparison pattern of organization."], "correct_answer": "b. Comparison/contrast pattern of organization.", "answer_status": "confirmed"}, {"id": "W3-A5-P2-Q2", "question": "To signal the pattern of organization in their writing, writers include____.", "type": "single_choice", "options": ["a. The main idea", "b. Supporting details.", "c. Transition words."], "correct_answer": "c. Transition words.", "answer_status": "confirmed"}, {"id": "W3-A5-P2-Q3", "question": "Making inferences requires the reader to state____.", "type": "single_choice", "options": ["a. Conclusions", "b. Hypotheses.", "c. Educated guesses", "d. (a) and (c)", "e. (b) and (c)"], "correct_answer": "e. (b) and (c)", "answer_status": "confirmed"}, {"id": "W3-A5-P2-Q4", "question": "When the text starts with background information about the characters, time, and place and describes the events according to time order, the pattern used is____.", "type": "single_choice", "options": ["a. Comparison/contrast organization", "b. Chronological organization", "c. Cause/effect organization"], "correct_answer": "b. Chronological organization", "answer_status": "confirmed"}, {"id": "W3-A5-P2-Q5", "question": "Susana is such a leech person. She borrows money from others and never pays them back..", "type": "single_choice", "options": ["a. Parasite", "b. Generous", "c. Honest"], "correct_answer": "a. Parasite", "answer_status": "confirmed"}, {"id": "W3-A5-P2-Q6", "question": "The dogs that are not adopted are usually euthanized. As a result, twenty dogs died last week.", "type": "multiple_choice", "options": ["a. Saved", "b. Exterminated", "c. Humanely put to death"], "correct_answer": ["b. Exterminated", "c. Humanely put to death"], "answer_status": "confirmed"}, {"id": "W3-A5-P2-Q7", "question": "My friend Liza is an honest person, but her sister, Sarra, is a deceitful person.", "type": "single_choice", "options": ["a. Truthful", "b. Dishonest", "c. Sincere"], "correct_answer": "b. Dishonest", "answer_status": "confirmed"}]}], "max_points": 13}, {"activity": "Activity6", "sections": [{"instructions": "Complete the following sentences by choosing the appropriate option(s)- a, b, c, d or e:", "questions": [{"id": "W3-A6-P1-Q1", "question": "when summarising, you should not ____.", "type": "single_choice", "options": ["a. Use your own words", "b. Focus on the important information", "c. Focus on the unimportant information", "d. Use synonyms for keywords"], "correct_answer": "c. Focus on the unimportant information", "answer_status": "confirmed"}, {"id": "W3-A6-P1-Q2", "question": "The length of the paraphrase is ____.", "type": "single_choice", "options": ["a. Longer than the summary", "b. Shorter than the summary", "c. Similar to the summary"], "correct_answer": "a. Longer than the summary", "answer_status": "confirmed"}, {"id": "W3-A6-P1-Q3", "question": "In the paraphrase we have to focus on the following:", "type": "single_choice", "options": ["a. Change sentence structure", "b. Use synonyms for keywords", "c. Simplifying the vocabulary", "d. Keeping the same ideas as the original text", "e. All of them"], "correct_answer": "e. All of them", "answer_status": "confirmed"}, {"id": "W3-A6-P1-Q4", "question": "Drawing conclusions is different from inferencing because____.", "type": "single_choice", "options": ["a. One of them is a post-reading strategy and the other is a while-reading strategy", "b. When concluding, we don't use prior knowledge", "c. When concluding, we don't make educated guesses"], "correct_answer": "a. One of them is a post-reading strategy and the other is a while-reading strategy", "answer_status": "confirmed"}, {"id": "W3-A6-P1-Q5", "question": "When writing a response to a reading selection, you should____.", "type": "single_choice", "options": ["a. Focus on the \"what\" of the reading", "b. Focus on the \"why\" of the reading", "c. Both"], "correct_answer": "b. Focus on the \"why\" of the reading", "answer_status": "confirmed"}]}, {"instructions": "Complete the following sentences by choosing the appropriate answer-( a), (b), or (c):", "questions": [{"id": "W3-A6-P2-Q1", "question": "We may conclude that ____.", "type": "single_choice", "options": ["a. Extroverted persons are more sociable than introverted persons", "b. Introverted persons prefer isolation.", "c. Introverted persons more sociable than Extroverted persons"], "correct_answer": "b. Introverted persons prefer isolation.", "answer_status": "confirmed", "passage": "Different from extroverted persons, Introverted people are often reticent during social interactions such as classroom discussions, birthday parties…etc. They would rather prefer spending their time reading books or listening to music alone."}, {"id": "W3-A6-P2-Q2", "question": "Which sentence better summarises the passage.", "type": "single_choice", "options": ["a. The importance of toponym descriptions in geography.", "b. The importance of toponym descriptions mainly in social sciences.", "c. The importance of toponym descriptions in human sciences."], "correct_answer": "b. The importance of toponym descriptions mainly in social sciences.", "answer_status": "confirmed", "passage": "Toponym is the study of names of places, specifically their meanings, typology, use, and origins. Toponyms contain descriptions of the place that may be of interest to different social scientists and even other sciences. Let's consider a geographer who can take advantage of certain indications for the topographical description of the terrain, and the hydraulic nature of the region, a historian who can find clues to corroborate a historical fact, an agronomist who studies the nature of the soil, a zoologist who is interested in extinct (or even current) fauna, a botanist looking for information on the flora… despite all the benefits descriptive toponyms could provide; yet, difficulties in locating the collections is one among others."}, {"id": "W3-A6-P2-Q3", "question": "We may conclude that ____.", "type": "single_choice", "options": ["a. All university teachers will start teaching in English their subjects in the near future.", "b. University teachers will receive training to improve their English proficiency level.", "c. English language will be used in doctoral and post-doctoral dissertations.", "d. All of them"], "correct_answer": "d. All of them", "answer_status": "confirmed", "passage": "The Ministry of Higher Education and Scientific Research has returned to the issue of English language teaching in universities. It is now a reality that the teaching of English will be integrated into the teaching process in Algerian universities, starting this year. In a letter addressed to the presidents of the regional conferences of universities, to be circulated to all directors of higher education institutions, the Ministry of Higher Education urged them to monitor and evaluate the effort of training teachers in English. It also asked to be kept informed of the number of teachers mastering this language and the institutions to which they belong, in order to start teaching in English this year, as the language that will allow Algerian graduates, professors, and researchers to prepare their theses."}]}, {"instructions": "Read the passage below carefully and actively, and then answer the questions that follow.", "questions": [{"id": "W3-A6-P3-Q1", "question": "Which of the following is the topic of the passage:", "type": "single_choice", "options": ["a. The first Moon landing", "b. Moon landings", "c. The last Moon landing"], "correct_answer": "b. Moon landings", "answer_status": "confirmed", "passage": "Only three and a half years passed between the first moon landing in 1969 and the sixth and last moon landing in 1972. While the first landing was an enormous achievement in itself, the last landing contributed far more to the advancement of scientific knowledge. On the first mission, the two astronauts were on the moon for only a few hours and remained close to the landing site. Their time on the moon was just sufficient to conduct several experiments and collect a small sample of lunar rocks. On the last mission, however, the three men (one of whom was a geologist) spent much more time on the lunar surface—three periods of about seven hours. With their special moon vehicle, they could travel farther from the landing site to investigate more of the lunar environment and collect a wider range of soil and rock samples.", "passage_reference": "Source: https://www.coursehero.com/file/p4ij13b/Moon-Landings-Only-three-and-a-half-years-passed-between-the-first-moon-landing (Questions design: Dr Radia BOUGUEBS)"}, {"id": "W3-A6-P3-Q2", "question": "The sentence \"Only three and a half years passed between the first moon landing in 1969 and the sixth and last moon landing in 1972\" is ____.", "type": "single_choice", "options": ["a. The main idea", "b. The concluding sentence", "c. The introducing sentence idea", "d. The supporting detail"], "correct_answer": "c. The introducing sentence idea", "answer_status": "confirmed"}, {"id": "W3-A6-P3-Q3", "question": "The pattern of organization followed is ____.", "type": "single_choice", "options": ["a. Cause/effect", "b. Chronological", "c. Contrast", "d. (a) and (b)", "e. (b) and (c)"], "correct_answer": "e. (b) and (c)", "answer_status": "confirmed"}]}], "max_points": 11}, {"activity": "Test2", "sections": [{"instructions": "Look at the title, read the first two sentences, and then answer the questions that follow: (Test design: Dr Radia BOUGUEBS)", "questions": [{"id": "W3-T2-P1-Q1", "question": "From the title, the text will talk about ...........", "type": "single_choice", "options": ["a. New York shootings", "b. Sentencing offenders", "c. Victims of the homicide", "d. Jury trials", "e. All the answers are correct"], "correct_answer": null, "answer_status": "unknown", "passage": "Jury Finds Gun Makers Liable in NY Shootings\n\nA federal jury, Thursday, found several gun makers responsible in three area shootings for letting guns fall into the hands of criminals. Other manufacturers were cleared.", "note": "The student picked 'd. Jury trials' and it was marked wrong; the correct option wasn't shown in the screenshot. Click 'Show answer' on the platform to get the key."}, {"id": "W3-T2-P1-Q2", "question": "What main topic(s) will be covered in this passage? Choose the appropriate(more than one answer is possible):", "type": "multiple_choice", "options": ["a. Anti-Gun laws in USA", "b. The gun industry in USA", "c. Guilty gun manufacturers", "d. Famous gun makers' manufacturers in USA", "e. Police investigations"], "correct_answer": null, "answer_status": "unknown", "note": "The student picked a, b and c and the combination was marked wrong; the exact correct set wasn't shown. Click 'Show answer' on the platform to get the key."}, {"id": "W3-T2-P1-Q3", "question": "What keywords do you expect to learn? Choose the appropriate (more than one answer is possible):", "type": "multiple_choice", "options": ["a. Gun", "b. Homicide", "c. Gun industry history", "d. Criminals", "e. Federal court"], "correct_answer": null, "answer_status": "unknown", "note": "The student picked a and d and the combination was marked wrong; the exact correct set wasn't shown. Click 'Show answer' on the platform to get the key."}, {"id": "W3-T2-P1-Q4", "question": "In answering questions 1, 2 and 3 which of the following strategies did you rely on:", "type": "multiple_choice", "options": ["a. Inferencing", "b. Predicting", "c. Skimming", "d. Previewing"], "correct_answer": ["b. Predicting", "d. Previewing"], "answer_status": "confirmed"}]}, {"instructions": "I read the following passage carefully, and then answer the questions that follow:", "questions": [{"id": "W3-T2-P2-Q1", "question": "Check your pre-reading predictions, and then choose one of the following:", "type": "single_choice", "options": ["a. All my predictions are correct.", "b. Some of my predictions are correct.", "c. All my predictions are not correct."], "correct_answer": "b. Some of my predictions are correct.", "answer_status": "confirmed", "passage": "Jury Finds Gun Makers Liable in NY Shootings\n\nA federal jury, Thursday, found several gun makers responsible in three area shootings for letting guns fall into the hands of criminals. Other manufacturers were cleared.\n\nThe only damages awarded were $560,000 to the sole survivor of the shootings, who was seriously wounded. Steven Fox, 19, and the relatives of six homicide victims sued the gun industry in federal court in 1995. Fox was shot in the head by a bullet accidentally discharged by a friend who had bought the gun on the street.\n\nThe class action lawsuit sought unspecified damages from an industry that generates sales of $2 billion to $3 billion a year.\n\nLike some of the suits brought against Big Tobacco, this one accused the gun industry of negligently marketing a legal product. The case was also closely watched by several cities trying to recover the costs of gun violence.\n\nThe jury found 15 of the 25 gun makers that were sued including \"Beretta USA Corp. and Colt's Manufacturing Co.\" distribute their products negligently. Smith & Wesson Corp. and Sturm, Ruger, and Co. were among those cleared.\n\nDuring the monthlong trial, the plaintiffs argued handgun makers oversupply gun-friendly markets in New York and other states with stricter anti-gun laws.", "passage_reference": "Adapted from: \"The Times News (Idaho Newspaper)\" Friday, February 12th, 1999."}, {"id": "W3-T2-P2-Q2", "question": "This text is adapted from:", "type": "single_choice", "options": ["a. An article in a magazine", "b. A website", "c. An article in a newspaper"], "correct_answer": "c. An article in a newspaper", "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q3", "question": "This text follows a……….", "type": "single_choice", "options": ["a. Comparison/contrast organisation", "b. Narrative organisation", "c. Cause/effect organisation"], "correct_answer": "b. Narrative organisation", "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q4", "question": "The sentence: \"The only damages awarded were $560,000 to the sole survivor of the shootings, who was seriously wounded.\" is:", "type": "single_choice", "options": ["a. An opinion", "b. A fact", "c. None of them"], "correct_answer": "b. A fact", "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q5", "question": "According to the passage, ONLY one of the following is correct", "type": "single_choice", "options": ["a. Six homicide victims sued the gun industry in federal court in 1995", "b. The relatives of six homicide victims sued the gun industry in federal court in 1995.", "c. Steven and the relatives of six homicide victims sued the gun industry in federal court in 1995."], "correct_answer": "c. Steven and the relatives of six homicide victims sued the gun industry in federal court in 1995.", "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q6", "question": "In the following sentence: \"Smith & Wesson Corp. and Sturm, Ruger, and Co. were among those cleared\". The word \"cleared\" doesn't mean", "type": "single_choice", "options": ["a. Eliminated", "b. Freed", "c. Liberated"], "correct_answer": "a. Eliminated", "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q7", "question": "In answering question 6 which of the following strategies did you rely on:", "type": "multiple_choice", "options": ["a. Inferencing", "b. Activating background knowledge", "c. Context clues"], "correct_answer": ["a. Inferencing", "c. Context clues"], "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q8", "question": "The sentence: \"the gun manufacturers were accused of being responsible in the three areas of the shootings because they negligently let guns fall into the hand of criminals.\" represents:", "type": "single_choice", "options": ["a. The major supporting idea", "b. The main idea.", "c. The supporting detail"], "correct_answer": "b. The main idea.", "answer_status": "confirmed"}, {"id": "W3-T2-P2-Q9", "question": "\"During the monthlong trial, the plaintiffs argued handgun makers oversupply gun-friendly markets in New York and other states with stricter anti-gun laws\". The sentence is:", "type": "single_choice", "options": ["a. A supporting detail", "b. An inference", "c. Concluding sentence"], "correct_answer": "c. Concluding sentence", "answer_status": "confirmed"}]}], "max_points": 13}]}]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
document.getElementById('themeSwitch').onclick=()=>{
  const h=document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');
};
const acts=[];
const weekGroups=[];
DATA.weeks.forEach(w=>{
  const idxs=[];
  w.activities.forEach(a=>{
    const qs=[];
    (a.sections||[{instructions:a.instructions,questions:a.questions}]).forEach(s=>s.questions.forEach(q=>qs.push({...q,instr:s.instructions})));
    acts.push({name:`Week ${w.week} · ${a.activity}`,label:a.activity,qs});
    idxs.push(acts.length-1);
  });
  weekGroups.push({title:w.title,idxs,open:true});
});
let S=null,sideOpen=true;
function toggleSide(open){
  sideOpen=open;
  $('#side').classList.toggle('collapsed',!sideOpen);
  $('#reopenBtn').classList.toggle('show',!sideOpen);
}
function toggleWeek(i){weekGroups[i].open=!weekGroups[i].open;renderSide()}
function renderSide(){
  $('#side').innerHTML=`<div class="side-head"><h3>Course outline</h3><button class="icon-btn" title="Hide sidebar" onclick="toggleSide(false)">✕</button></div>
    ${weekGroups.map((g,wi)=>`
      <div class="week ${g.open?'open':''}">
        <div class="week-head" onclick="toggleWeek(${wi})"><span class="chev">▶</span><span>${esc(g.title)}</span></div>
        <div class="week-body">
          ${g.idxs.map(i=>{const a=acts[i];return `<label><input type="checkbox" class="sel" value="${i}" ${S?'':'checked'} ${S?'disabled':''}>
            <span>${esc(a.label)}<span class="cnt">${a.qs.filter(q=>q.correct_answer!=null).length} questions</span></span>
          </label>`}).join('')}
        </div>
      </div>`).join('')}
    <div class="footctl">
      <label style="border:0;padding:0;display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="shuf" ${S?'disabled':''}> Shuffle questions</label>
      ${S?'<button class="ghost" onclick="home()">Back to menu</button>':'<button class="primary" onclick="start()">Start quiz</button>'}
    </div>`;
}
function home(){S=null;renderSide();
  $('#main').innerHTML=`<div class="unit"><h1>Practice Quiz</h1><div class="meta">Select activities from the course outline on the left, then start the quiz. Answer every question, submit, and get your score with the correct answers shown.</div></div>`;
}
function start(){
  const ids=[...document.querySelectorAll('.sel:checked')].map(x=>+x.value);
  if(!ids.length)return alert('Select at least one activity.');
  let list=ids.flatMap(i=>acts[i].qs.filter(q=>q.correct_answer!=null).map(q=>({...q,act:acts[i].name})));
  if(document.getElementById('shuf').checked)list.sort(()=>Math.random()-.5);
  let lastKey=null;
  list.forEach(q=>{const key=q.act+'|'+(q.instr||'')+'|'+(q.passage||'');q.__header=(key!==lastKey);lastKey=key;});
  S={list,ans:{},done:false};renderSide();quiz();window.scrollTo(0,0);
}
function grade(q,a){
  const c=q.correct_answer,t=q.type;
  if(a===undefined||a===null)return 0;
  if(t==='multiple_choice'){const x=new Set(a);return x.size===c.length&&c.every(v=>x.has(v))?1:0}
  if(t==='fill_in_blank')return norm(a)===norm(c)?1:0;
  if(t==='matching'||t==='dropdown_passage'){const k=Object.keys(c);return k.filter(x=>norm(a[x])===norm(c[x])).length/k.length}
  return a===c?1:0;
}
function answered(){return S.list.filter((q,i)=>{const a=S.ans[i];return a&&(typeof a==='string'?a.trim():Array.isArray(a)?a.length:Object.values(a).some(v=>v))}).length}
function qblock(q,i){
  const a=S.ans[i],d=S.done,dis=d?'disabled':'',f=d?grade(q,a):null;
  let h=`<div class="q-block"><div class="tag">${esc(q.act)} · ${esc(q.id)}</div>`;
  if(q.__header){
    if(q.instr)h+=`<div class="instr">${esc(q.instr)}</div>`;
    if(q.passage)h+=`<p class="passage">${esc(q.passage)}${q.passage_reference?`<br><br><em>${esc(q.passage_reference)}</em>`:''}</p>`;
  }
  h+=`<div class="q">${i+1}. ${esc(q.question)}</div>`;
  const t=q.type;
  if(t==='matching'||t==='dropdown_passage'){
    Object.keys(q.correct_answer).forEach(k=>{
      const v=(a&&a[k])||'',ok=d&&norm(v)===norm(q.correct_answer[k]);
      const inp=t==='matching'?`<select data-q="${i}" data-k="${esc(k)}" ${dis}><option value="">— choose —</option>${q.choices.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`
        :`<input class="txt" data-q="${i}" data-k="${esc(k)}" value="${esc(v)}" placeholder="Missing word" ${dis}>`;
      h+=`<div class="rowq ${d?(ok?'ok':'bad'):''}"><div>${esc(k)}</div><div>${inp}${d&&!ok?`<div class="fb">Correct: ${esc(q.correct_answer[k])}</div>`:''}</div></div>`;
    });
  }else if(t==='fill_in_blank'){
    h+=`<input class="txt" data-q="${i}" value="${esc(a||'')}" placeholder="Your answer" ${dis}>`;
    if(q.choices_in_question)h+=`<div class="instr">Choices: ${q.choices_in_question.map(esc).join(' / ')}</div>`;
    if(d&&f!==1)h+=`<div class="fb">Correct: ${esc(q.correct_answer)}</div>`;
  }else{
    const multi=t==='multiple_choice',cor=multi?q.correct_answer:[q.correct_answer];
    if(multi&&!d)h+=`<div class="instr">Select ${cor.length} answer(s)</div>`;
    q.options.forEach(o=>{
      const on=multi?(a||[]).includes(o):a===o;
      const cls=d?(cor.includes(o)?'right':on?'wrong':''):'';
      const mark=d&&cor.includes(o)?'<span class="mark ok">✓</span>':(d&&on?'<span class="mark ko">✕</span>':'');
      h+=`<label class="opt ${cls}"><input type="${multi?'checkbox':'radio'}" name="q${i}" data-q="${i}" data-v="${esc(o)}" ${on?'checked':''} ${dis}><span>${esc(o)}</span>${mark}</label>`;
    });
  }
  if(d&&q.answer_status!=='confirmed')h+=`<div class="note">⚠ Answer inferred, not confirmed by the platform.${q.note?' '+esc(q.note):''}</div>`;
  return h+'</div>';
}
function quiz(){
  const L=S.list;let head,foot='';
  if(S.done){
    const g=L.map((q,i)=>grade(q,S.ans[i])),tot=g.reduce((x,y)=>x+y,0),pct=Math.round(100*tot/L.length);
    head=`<div class="unit scorebox"><div class="score">${tot%1?tot.toFixed(1):tot} / ${L.length}</div><div class="meta">${pct}% · ${g.filter(x=>x===1).length} correct, ${g.filter(x=>x>0&&x<1).length} partial, ${g.filter(x=>x===0).length} wrong</div>
    <div class="row"><button class="primary" onclick="retry()">Retry same set</button><button class="ghost" onclick="home()">Back to menu</button></div></div>`;
  }else{
    head=`<div class="unit"><h1>Practice Quiz</h1><div class="bookmark progressbar">Answered ${answered()} / ${L.length}</div></div>`;
    foot=`<div class="row" style="max-width:1120px;margin:16px auto"><button class="primary" onclick="submitQ()">Submit &amp; see score</button></div>`;
  }
  $('#main').innerHTML=`${head}<div class="unit">${L.map(qblock).join('')}</div>${foot}`;
}
function retry(){S={list:S.list,ans:{},done:false};quiz();window.scrollTo(0,0)}
function submitQ(){
  const un=S.list.length-answered();
  if(un&&!confirm(`${un} question(s) unanswered. Submit anyway?`))return;
  S.done=true;renderSide();quiz();window.scrollTo(0,0);
}
function upd(e){
  if(!S||S.done)return;const el=e.target,i=el.dataset.q;if(i===undefined)return;
  if(el.type==='radio')S.ans[i]=el.dataset.v;
  else if(el.type==='checkbox')S.ans[i]=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(x=>x.dataset.v);
  else if(el.dataset.k!==undefined){(S.ans[i]=S.ans[i]||{})[el.dataset.k]=el.value}
  else S.ans[i]=el.value;
  const p=document.querySelector('.progressbar');if(p)p.textContent=`Answered ${answered()} / ${S.list.length}`;
}
document.addEventListener('input',upd);document.addEventListener('change',upd);
renderSide();home();
</script>
</body></html>
